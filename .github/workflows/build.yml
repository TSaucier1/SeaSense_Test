# Builds SeaSenseTester.exe on a Windows machine in GitHub's cloud.
#
# - Every push to main: the .exe is uploaded as a build "artifact"
#   (Actions tab -> latest run -> Artifacts, download while signed in).
# - Pushing a tag like v1.0.1: the .exe is also attached to a GitHub
#   Release (Releases page on the repo, easiest download).
# - "Run workflow" button on the Actions tab: builds on demand.

name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write     # needed to attach the .exe to a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run protocol unit tests
        run: python -m unittest test_protocol.py -v

      - name: Build single-file exe
        run: pyinstaller --onefile --windowed --name SeaSenseTester seasense_gui.py

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaSenseTester-windows
          path: dist/SeaSenseTester.exe

      - name: Attach exe to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SeaSenseTester.exe
