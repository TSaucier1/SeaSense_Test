# Builds SeaSenseTester_v1.0.N.exe on a Windows machine in GitHub's cloud and
# publishes it as a GitHub Release (Releases panel on the repo's main page).
#
# - Every push to main: tests run, the .exe is built, and a new Release
#   named v1.0.<build number> is published with the .exe attached.
# - "Run workflow" button on the Actions tab: same thing, on demand.
# - The .exe is also kept as a build "artifact" on the run's page.

name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write     # needed to create the Release and its tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run protocol unit tests
        run: python -m unittest test_protocol.py -v

      # Version number for this build, e.g. 1.0.5.  Used in the window
      # title, the .exe file name and the Release name so they always match.
      - name: Set version
        shell: bash
        run: |
          echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"1.0.${{ github.run_number }}\"/" seasense_gui.py
          grep "^APP_VERSION" seasense_gui.py

      - name: Build single-file exe
        run: pyinstaller --onefile --windowed --name SeaSenseTester_v${{ env.VERSION }} seasense_gui.py

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaSenseTester_v${{ env.VERSION }}
          path: dist/SeaSenseTester_v${{ env.VERSION }}.exe

      # Creates the tag v1.0.N on this commit and a Release with the .exe.
      # (Tags made by this built-in token do not re-trigger the workflow.)
      - name: Publish Release with the exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SeaSense Tester v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Windows

            Download **SeaSenseTester_v${{ env.VERSION }}.exe** below and double-click it. No install needed.
            Windows may show a SmartScreen warning for an unsigned app: *More info -> Run anyway*.
            If the download shows "Failed - No file", your antivirus removed it: check
            *Windows Security -> Protection history* and restore / allow it.

            ## Linux

            The .exe is Windows-only, but the same app runs on Linux from the source code.

            1. Install Python's Tk and serial support (Debian / Ubuntu / Raspberry Pi OS):

            ```
            sudo apt install python3-tk python3-serial
            ```

            (Fedora: `sudo dnf install python3-tkinter python3-pyserial`)

            2. Download **Source code (tar.gz)** below, then extract it:

            ```
            tar xzf SeaSense_Test-${{ env.VERSION }}.tar.gz
            ```

            ```
            cd SeaSense_Test-${{ env.VERSION }}
            ```

            3. Run it:

            ```
            python3 seasense_gui.py
            ```

            USB serial adapters appear as `/dev/ttyUSB0` (or `/dev/ttyACM0`) in the COM port list.
            If Connect says "permission denied", add yourself to the `dialout` group once, then log out and back in:

            ```
            sudo usermod -aG dialout $USER
            ```

            ## Notes

            - Serial settings: 8N1, no flow control, 9600 baud unless the light was changed.
            - See the README on the repo's main page for wiring, every tab, and the FSET / FPRT setup commands.

            Built from commit ${{ github.sha }}.
          make_latest: true
          files: dist/SeaSenseTester_v${{ env.VERSION }}.exe
